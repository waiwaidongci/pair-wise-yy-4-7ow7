<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古测线重叠与拼图准入台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 23px; }
    h2 { font-size: 16px; margin: 14px 0 8px; }
    h3 { font-size: 14px; margin: 10px 0 6px; }
    button { border: 0; border-radius: 8px; padding: 9px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button:disabled { background: #9bb4b8; cursor: not-allowed; }
    button.secondary { background: #64777b; }
    button.danger { background: #a4473d; }
    input, select { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 8px; font: inherit; background: #fff; }
    label { display: block; margin: 8px 0 4px; color: #5c7378; font-size: 12px; }
    .app { display: grid; grid-template-columns: 1fr 380px; gap: 14px; padding: 14px; align-items: start; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 106px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; user-select: none; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.25); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); pointer-events: none; }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.18); top: 27%; transform: rotate(-9deg); pointer-events: none; }

    .survey-svg { position: absolute; inset: 0; pointer-events: none; }
    .survey-svg .grid { stroke: rgba(220,235,224,.18); stroke-width: 1; }
    .survey-svg .grid.edge { stroke: rgba(220,235,224,.4); }
    .survey-svg .gridlabel { fill: rgba(220,235,224,.55); font-size: 10px; }
    .survey-svg .swath { pointer-events: auto; cursor: pointer; stroke-width: 1.4; }
    .survey-svg .swath.ok { fill: rgba(78,180,124,.22); stroke: rgba(126,224,162,.75); }
    .survey-svg .swath.bad { fill: rgba(214,84,70,.24); stroke: rgba(240,130,110,.85); }
    .survey-svg .swath.selected { stroke-width: 3; }
    .survey-svg .cline { stroke-width: 2; pointer-events: none; }
    .survey-svg .cline.ok { stroke: #8fe3ad; }
    .survey-svg .cline.bad { stroke: #f0a08e; }
    .survey-svg .cline.selected { stroke: #ffea7c; stroke-dasharray: none; }
    .survey-svg .line-hit { stroke: transparent; stroke-width: 14; pointer-events: auto; cursor: pointer; }
    .survey-svg .heading { stroke: #fff; fill: #fff; stroke-width: 2; }
    .survey-svg .codelabel { fill: #f2f8f8; font-size: 11px; font-weight: 700; paint-order: stroke; stroke: rgba(7,51,63,.85); stroke-width: 3; pointer-events: none; }
    .survey-svg .pair.ok { fill: #2e9158; stroke: #d7f3e2; }
    .survey-svg .pair.bad { fill: #c0493b; stroke: #f6d3cc; }
    .survey-svg .pairlabel { fill: #fff; font-size: 10px; font-weight: 800; pointer-events: none; }
    .survey-svg .bufferline { stroke: #ffea7c; stroke-width: 2.5; stroke-dasharray: 6 5; }
    .survey-svg .draftpulse { fill: none; stroke: #ffea7c; stroke-width: 2; opacity: .8; }
    .survey-svg .handle { pointer-events: auto; cursor: grab; stroke: #fff; stroke-width: 2; }
    .survey-svg .handle:active { cursor: grabbing; }
    .survey-svg .handle.saved { fill: #ffea7c; }
    .survey-svg .handle.buffering { fill: #ffc24d; }
    .survey-svg .handle.draft { fill: #7fd3de; }

    .scalebar { position: absolute; right: 12px; bottom: 10px; border-bottom: 3px solid #fff; border-left: 3px solid #fff; border-right: 3px solid #fff; width: 80px; height: 10px; pointer-events: none; }
    .scalebar span { position: absolute; top: -17px; left: 0; right: 0; text-align: center; color: #fff; font-size: 11px; font-weight: 700; }
    .maphint { position: absolute; left: 12px; bottom: 8px; color: rgba(255,255,255,.85); font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

    .status { border-radius: 8px; padding: 12px; border: 2px solid; }
    .status.ready { background: #eaf8f0; border-color: #2e9158; }
    .status.waiting { background: #fdf2e3; border-color: #d08a2f; }
    .status.none { background: #f1f4f5; border-color: #b9c9cc; }
    .status h2 { margin-top: 0; display: flex; align-items: center; gap: 8px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .badge.ready { background: #2e9158; color: #fff; }
    .badge.waiting { background: #d08a2f; color: #fff; }
    .badge.passed { background: #1d6c78; color: #fff; }
    .badge.readonly { background: #64777b; color: #fff; }
    .reasons { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: #7a4a17; }
    .reasons li { margin: 3px 0; }
    .note { font-size: 12px; color: #5c7378; margin: 8px 0 0; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .list { display: grid; gap: 7px; max-height: 248px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 9px 10px; cursor: pointer; font-size: 13px; }
    .item:hover { background: #f3f9fa; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .item .line1 { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .item .muted, .muted { color: #5c7378; font-size: 12px; }
    .diag { margin-top: 4px; font-size: 12px; }
    .diag.ok { color: #2e9158; }
    .diag.bad { color: #c0493b; }

    .results { display: grid; gap: 7px; }
    .result-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid #d7e4e5; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .result-item.current { border-color: #2e9158; background: #eaf8f0; }

    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #183035; color: #fff; padding: 11px 18px; border-radius: 8px; font-size: 14px; z-index: 50; max-width: 80vw; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.bad { background: #8f3529; }
    .toast.ok { background: #22603c; }

    .modal-mask { position: fixed; inset: 0; background: rgba(10,30,36,.55); display: none; place-items: center; z-index: 40; }
    .modal-mask.show { display: grid; }
    .modal { background: #fff; border-radius: 10px; padding: 18px; width: min(640px, 92vw); max-height: 84vh; overflow: auto; }
    .modal pre { background: #f3f6f7; border-radius: 6px; padding: 10px; font-size: 12px; overflow: auto; }
    .rightcol { display: grid; gap: 14px; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古测线重叠与拼图准入台</h1>
      <div class="muted">每个潜次按测线编号登记；相邻测线覆盖率 30%~50%、航向交替才可生成拼图成果。</div>
    </div>
    <button id="resetBtn" class="secondary" type="button">重置演示数据</button>
  </header>
  <main class="app">
    <section class="panel" style="padding:8px;">
      <div class="map" id="map">
        <div class="wreck"></div>
        <!-- 船肋装饰 -->
        <div class="rib" style="left:28%;"></div><div class="rib" style="left:35%;"></div>
        <div class="rib" style="left:42%;"></div><div class="rib" style="left:49%;"></div>
        <div class="rib" style="left:56%;"></div><div class="rib" style="left:63%;"></div>
        <div class="rib" style="left:70%;"></div>
      </div>
    </section>

    <div class="rightcol">
      <section class="panel">
        <div id="statusCard" class="status none">
          <h2>拼图准入 <span id="statusBadge" class="badge">计算中</span></h2>
          <div id="statusText" class="muted"></div>
          <ul id="statusReasons" class="reasons"></ul>
          <div class="actions">
            <button id="generateBtn" type="button">生成成果</button>
            <button id="exportCurrentBtn" type="button" class="secondary">导出当前成果</button>
          </div>
          <div id="statusNote" class="note"></div>
        </div>
      </section>

      <section class="panel">
        <form id="lineForm">
          <h2 id="formTitle">登记测线 / 潜次</h2>
          <input name="id" type="hidden">
          <div class="row2">
            <div><label>测线编号（唯一）</label><input name="code" required placeholder="L-05"></div>
            <div><label>潜水员</label><input name="diver" required placeholder="姓名"></div>
          </div>
          <div class="row2">
            <div><label>起点 E（米）</label><input name="se" type="number" step="0.1" required></div>
            <div><label>起点 N（米）</label><input name="sn" type="number" step="0.1" required></div>
          </div>
          <div class="row2">
            <div><label>终点 E（米）</label><input name="ee" type="number" step="0.1" required></div>
            <div><label>终点 N（米）</label><input name="en" type="number" step="0.1" required></div>
          </div>
          <div class="row3">
            <div><label>航向（°，0=北）</label><input name="heading" type="number" min="0" max="359" step="1" required></div>
            <div><label>&nbsp;</label><button type="button" id="deriveBtn" class="secondary" style="width:100%;">按起止推算</button></div>
            <div></div>
          </div>
          <div class="row2">
            <div><label>测宽（米）</label><input name="width" type="number" step="0.1" min="0.1" required></div>
            <div><label>拍照间隔（秒）</label><input name="interval" type="number" step="0.5" min="0.1" required></div>
          </div>
          <div class="actions">
            <button id="saveBtn">保存测线</button>
            <button type="button" id="cancelBtn" class="secondary">取消</button>
            <button type="button" id="deleteBtn" class="danger">删除</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>测线列表</h2>
        <div id="lineList" class="list"></div>
      </section>

      <section class="panel">
        <h2>成果版本（只读归档）</h2>
        <div id="resultList" class="results"></div>
      </section>
    </div>
  </main>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h2 id="modalTitle">成果详情</h2>
      <pre id="modalBody"></pre>
      <div class="actions"><button id="modalClose" type="button" class="secondary">关闭</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/survey-rules.js"></script>
  <script src="js/survey-store.js"></script>
  <script src="js/survey-map.js"></script>
  <script>
  (function () {
    "use strict";
    var Rules = window.SurveyRules, Store = window.SurveyStore, Map = window.SurveyMap;

    var mapEl = document.getElementById("map");
    var form = document.getElementById("lineForm");
    var listEl = document.getElementById("lineList");
    var resultsEl = document.getElementById("resultList");
    var statusCard = document.getElementById("statusCard");
    var statusBadge = document.getElementById("statusBadge");
    var statusText = document.getElementById("statusText");
    var statusReasons = document.getElementById("statusReasons");
    var statusNote = document.getElementById("statusNote");
    var genBtn = document.getElementById("generateBtn");
    var exportBtn = document.getElementById("exportCurrentBtn");
    var toastEl = document.getElementById("toast");
    var modalMask = document.getElementById("modalMask");
    var modalTitle = document.getElementById("modalTitle");
    var modalBody = document.getElementById("modalBody");

    var buffer = null;      // 表单正在编辑/新建的测线（未保存）
    var submitting = false;
    var toastTimer = null;

    function toast(msg, kind) {
      toastEl.textContent = msg;
      toastEl.className = "toast show" + (kind ? " " + kind : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = "toast"; }, 2800);
    }

    function formRaw() {
      return {
        id: form.id.value,
        code: form.code.value,
        diver: form.diver.value,
        start: { e: form.se.value, n: form.sn.value },
        end: { e: form.ee.value, n: form.en.value },
        heading: form.heading.value,
        width: form.width.value,
        interval: form.interval.value
      };
    }

    function fillForm(l, points) {
      form.id.value = l && l.id ? l.id : "";
      form.code.value = l && l.code ? l.code : (points ? "" : Rules.nextCode(Store.listLines()));
      form.diver.value = (l && l.diver) || "";
      var st = (l && l.start) || (points && points.start) || { e: "", n: "" };
      var en = (l && l.end) || (points && points.end) || { e: "", n: "" };
      form.se.value = st.e; form.sn.value = st.n;
      form.ee.value = en.e; form.en.value = en.n;
      form.heading.value = l ? l.heading : "";
      form.width.value = l ? l.width : 40;
      form.interval.value = l ? l.interval : 3;
      document.getElementById("formTitle").textContent =
        (l && l.id) ? "编辑测线 " + l.code + "（修改后相关拼图立即失效）" : "登记测线 / 潜次";
      document.getElementById("deleteBtn").disabled = !(l && l.id);
    }

    function startNew(points) {
      var base = null;
      buffer = points
        ? { code: "", diver: "", start: points.start, end: points.end, heading: "", width: 40, interval: 3 }
        : null;
      fillForm(base, points);
      mapApi.setState({ selectedId: null, buffer: buffer });
      if (points) deriveHeading(true);
    }

    function selectLine(id) {
      var l = Store.findLine(id);
      if (!l) return;
      buffer = null;
      mapApi.clearDraft();
      fillForm(l);
      mapApi.setState({ selectedId: id, buffer: null });
      render();
    }

    function deriveHeading(silent) {
      var raw = formRaw();
      var se = Number(raw.start.e), sn = Number(raw.start.n);
      var ee = Number(raw.end.e), en = Number(raw.end.n);
      if (![se, sn, ee, en].every(isFinite)) {
        if (!silent) toast("起止坐标不完整，无法推算航向", "bad");
        return;
      }
      if (se === ee && sn === en) {
        if (!silent) toast("起止点重合，无法推算航向", "bad");
        return;
      }
      form.heading.value = Math.round(Rules.geometry({
        start: { e: se, n: sn }, end: { e: ee, n: en }
      }).bearing);
      syncBuffer();
    }

    // 表单 -> 预览缓冲（未保存的改动立即在图上反映，成果状态仍以已保存数据为准）
    function syncBuffer() {
      var raw = formRaw();
      var nums = [raw.start.e, raw.start.n, raw.end.e, raw.end.n, raw.heading, raw.width, raw.interval].map(Number);
      if (!nums.every(isFinite)) { mapApi.setBuffer(null); buffer = null; return; }
      buffer = {
        id: raw.id || null,
        code: raw.code.trim().toUpperCase(),
        diver: raw.diver.trim(),
        start: { e: Rules.round2(nums[0]), n: Rules.round2(nums[1]) },
        end: { e: Rules.round2(nums[2]), n: Rules.round2(nums[3]) },
        heading: Rules.normHeading(nums[4]),
        width: Rules.round2(nums[5]), interval: Rules.round2(nums[6])
      };
      mapApi.setBuffer(buffer);
    }

    function save() {
      var raw = formRaw();
      var res = raw.id ? Store.updateLine(raw.id, raw) : Store.addLine(raw);
      if (!res.ok) { toast(res.errors[0], "bad"); return false; }
      if (res.invalidated) toast("测线 " + res.line.code + " 已修改：相关拼图立即失效，已按新数据重算；旧成果保持只读", "ok");
      else toast(raw.id ? "测线已保存（潜水员变更不影响拼图）" : "测线 " + res.line.code + " 已登记", "ok");
      buffer = null;
      mapApi.clearDraft();
      fillForm(res.line);
      mapApi.setState({ selectedId: res.line.id, buffer: null });
      render();
      return true;
    }

    function generate() {
      if (submitting) { toast("拼图正在处理中，本次点击沿用首次结果"); return; }
      if (buffer && formDirty()) { toast("有未保存的测线改动，请先保存或取消再生成", "bad"); return; }
      var ev = Store.currentEvaluation();
      if (!ev.ready) {
        toast("当前只能进入待补测：覆盖率或航向不达标，不生成成果、不占用版本号");
      }
      submitting = true;
      genBtn.disabled = true;
      genBtn.innerHTML = '<span class="spinner"></span> 拼图处理中…';
      Store.submitMosaic().then(function (r) {
        submitting = false;
        genBtn.disabled = false;
        genBtn.textContent = "生成成果";
        if (r.status === "passed") {
          toast(r.reused
            ? "沿用首次结果：与已通过的 v" + r.result.version + " 数据一致，不重复占用版本"
            : "拼图通过准入，已生成只读成果 v" + r.result.version, "ok");
        } else {
          toast("拼图进入待补测：未生成成果、未占用版本号", "bad");
        }
        render();
      });
    }

    function formDirty() {
      if (!buffer) return false;
      if (!buffer.id) return true;
      var saved = Store.findLine(buffer.id);
      return saved && Rules.fingerprint([saved]) !== Rules.fingerprint([buffer]);
    }

    function exportCurrent() {
      var fp = Store.currentFingerprint();
      var passed = Store.matchingPassed(fp);
      if (!passed) {
        toast("当前数据没有已通过成果：待补测或未生成，禁止导出", "bad");
        return;
      }
      download(passed.version);
    }

    function download(version) {
      var data = Store.resultExport(version);
      if (!data) { toast("该版本不可导出", "bad"); return; }
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "mosaic-v" + version + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("已导出只读成果 v" + version, "ok");
    }

    function showResult(version) {
      var data = Store.resultExport(version);
      if (!data) return;
      modalTitle.textContent = "成果 v" + version + "（只读）";
      modalBody.textContent = JSON.stringify(data, null, 2);
      modalMask.classList.add("show");
    }

    // ---------- 渲染：列表 / 测线图 / 状态卡 / 版本历史，全部来自同一份持久化快照 ----------
    function pairMap(ev) {
      var m = {};
      ev.pairs.forEach(function (p) { m[p.aId] = p; m[p.bId] = p; });
      return m;
    }

    function render() {
      var lines = Store.listLines();
      var ev = Store.currentEvaluation();
      var fp = Store.currentFingerprint();
      var pm = pairMap(ev);

      // 测线图
      mapApi.setState({ lines: lines, pairs: ev.pairs, selectedId: form.id.value || null });

      // 列表
      listEl.innerHTML = lines.map(function (l) {
        var p = pm[l.id];
        var diag = "";
        if (p) {
          var problems = [];
          if (p.rate < Rules.LIMITS.MIN_OVERLAP) problems.push("覆盖率 " + p.rateText + " 低于三成");
          if (p.rate > Rules.LIMITS.MAX_OVERLAP) problems.push("覆盖率 " + p.rateText + " 高于五成");
          if (!p.alternate) problems.push("航向未交替");
          diag = problems.length
            ? '<div class="diag bad">相邻 ' + (p.aId === l.id ? p.bCode : p.aCode) + '：' + problems.join("；") + '</div>'
            : '<div class="diag ok">相邻 ' + (p.aId === l.id ? p.bCode : p.aCode) + '：覆盖率 ' + p.rateText + '，航向交替 ✓</div>';
        } else {
          diag = '<div class="muted">尚无相邻测线</div>';
        }
        return '<div class="item' + (l.id === form.id.value ? ' active' : '') + '" data-id="' + l.id + '">' +
          '<div class="line1"><b>' + l.code + '</b><span class="muted">' + l.diver + '</span></div>' +
          '<div class="muted">' + Math.round(l.heading) + '° · 测宽 ' + l.width + 'm · 间隔 ' + l.interval + 's · ' +
          '(' + l.start.e + ',' + l.start.n + ')→(' + l.end.e + ',' + l.end.n + ')</div>' + diag + '</div>';
      }).join("") || '<div class="muted">暂无测线，点击平面图两下来登记第一条。</div>';
      listEl.querySelectorAll("[data-id]").forEach(function (node) {
        node.addEventListener("click", function () { selectLine(node.dataset.id); });
      });

      // 状态卡
      var passed = Store.matchingPassed(fp);
      statusReasons.innerHTML = ev.reasons.map(function (r) { return "<li>" + r + "</li>"; }).join("");
      if (lines.length < 2) {
        statusCard.className = "status none";
        statusBadge.className = "badge";
        statusBadge.textContent = "数据不足";
        statusText.textContent = "至少登记 2 条测线才能评估拼图准入。";
        statusNote.textContent = "规则：覆盖率 30%~50%（含边界）、相邻航向交替。";
      } else if (ev.ready) {
        statusCard.className = "status ready";
        statusBadge.className = "badge ready";
        statusBadge.textContent = passed ? "成果有效" : "准入通过";
        statusText.textContent = passed
          ? "当前数据与只读成果 v" + passed.version + " 一致，可导出。"
          : "全部相邻测线达标，可以生成拼图成果。";
        statusNote.textContent = passed
          ? "重复/并发提交将沿用 v" + passed.version + "，不会占用新版本号。"
          : "生成后成果只读；之后修改坐标、航向、测宽或拍照间隔，成果立即失效并按新数据重算。";
      } else {
        statusCard.className = "status waiting";
        statusBadge.className = "badge waiting";
        statusBadge.textContent = "待补测";
        statusText.textContent = "覆盖率或航向不达标：拼图只进入待补测，不能生成成果或导出，也不占用已通过成果版本。";
        statusNote.textContent = passed
          ? "注意：已有归档的 v" + passed.version + " 是更早数据的成果，与当前数据不一致，保持只读。"
          : "补测达标后再次提交才会占用新的成果版本号。";
      }

      // 版本历史
      var results = Store.listResults();
      resultsEl.innerHTML = results.map(function (r) {
        var current = r.fp === fp && r.status === "passed";
        return '<div class="result-item' + (current ? ' current' : '') + '">' +
          '<div><b>v' + r.version + '</b> <span class="badge passed">已通过</span> ' +
          '<span class="badge readonly">只读</span>' +
          '<div class="muted">' + Rules.formatDateTime(r.createdAt) + ' · ' + r.lines.length + ' 条测线' +
          (current ? ' · 当前数据' : ' · 历史数据') + '</div></div>' +
          '<div class="actions" style="margin:0;"><button data-view="' + r.version + '" class="secondary" type="button">查看</button>' +
          '<button data-export="' + r.version + '" type="button">导出</button></div></div>';
      }).join("") || '<div class="muted">尚无通过准入的成果版本。</div>';
      resultsEl.querySelectorAll("[data-view]").forEach(function (b) {
        b.addEventListener("click", function () { showResult(Number(b.dataset.view)); });
      });
      resultsEl.querySelectorAll("[data-export]").forEach(function (b) {
        b.addEventListener("click", function () { download(Number(b.dataset.export)); });
      });
    }

    // ---------- 事件装配 ----------
    var mapApi = Map.attach(mapEl, {
      onBounds: function (b) { Store.setBounds(b); },
      onDraftComplete: function (points) { startNew(points); },
      onPick: function (pt) {
        if (!buffer) startNew({ start: pt, end: { e: pt.e, n: pt.n } });
      },
      onSelect: function (id) { selectLine(id); },
      onEditBuffer: function (b) {
        buffer = b;
        form.se.value = b.start.e; form.sn.value = b.start.n;
        form.ee.value = b.end.e; form.en.value = b.end.n;
      }
    });

    form.addEventListener("submit", function (e) { e.preventDefault(); save(); });
    form.addEventListener("input", function () { syncBuffer(); });
    document.getElementById("deriveBtn").addEventListener("click", function () { deriveHeading(false); });
    document.getElementById("cancelBtn").addEventListener("click", function () {
      buffer = null; mapApi.clearDraft();
      if (form.id.value) { selectLine(form.id.value); } else { startNew(null); render(); }
    });
    document.getElementById("deleteBtn").addEventListener("click", function () {
      if (!form.id.value) return;
      var code = form.code.value;
      if (!window.confirm("删除测线 " + code + "？相关拼图将按剩余测线重算（旧成果只读保留）。")) return;
      Store.removeLine(form.id.value);
      buffer = null; startNew(null); render();
      toast("已删除 " + code);
    });
    genBtn.addEventListener("click", generate);
    exportBtn.addEventListener("click", exportCurrent);
    document.getElementById("modalClose").addEventListener("click", function () {
      modalMask.classList.remove("show");
    });
    modalMask.addEventListener("click", function (e) {
      if (e.target === modalMask) modalMask.classList.remove("show");
    });
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (!window.confirm("重置为演示数据？当前测线与成果版本将被清空。")) return;
      Store.reset();
      startNew(null);
      render();
      toast("已重置演示数据");
    });
    // 持久化层任何变更（含其他标签页的逻辑入口）都统一重绘，保证三处视图一致
    Store.subscribe(function () { render(); });

    startNew(null);
    render();
  })();
  </script>
</body>
</html>
